_target_: src.models.fusion_module.FusionLitModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.001
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.SequentialLR
  _partial_: true
  schedulers:
    - _target_: torch.optim.lr_scheduler.LinearLR
      _partial_: true
      start_factor: 0.1
      end_factor: 1.0
      total_iters: 5  # 5 epochs for warmup

    - _target_: torch.optim.lr_scheduler.CosineAnnealingLR
      _partial_: true
      # T_max should be total_epochs - warmup_epochs.
      # For example, if total epochs is 50, T_max should be 45.
      T_max: 495
      eta_min: 1e-7 # Minimum learning rate

  milestones: [5] # Switch schedulers after 5 epochs

net:
  _target_: src.models.components.fusion_net.FusionNet
  wifi_config:
    pretrained_path: "data/adca/trained_models/wifi-lenet-self_attention.pth"
    freeze: true
    use_attention: true
  video_config:
    pretrained_list:
      - "data/adca/trained_models/video_resnet_v1_mae2.15.pth"
      - "data/adca/trained_models/video_resnet_v2_mae0.96.pth"
      - "data/adca/trained_models/video_resnet_v3_mae5.67.pth"
      - "data/adca/trained_models/video_resnet_v4_mae1.87.pth"
      - "data/adca/trained_models/video_resnet_v5_mae3.37.pth"
    freeze: true
    use_attention: true
    use_pretrained: true
  fusion_config:
    fusion_video_scheme: 3
    video_indices: [3, 5, 4, 2, 1]
    output_size: 5

compile: true
